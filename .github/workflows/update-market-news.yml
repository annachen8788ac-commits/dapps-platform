name: Update Market Intelligence News

on:
  push:
    branches: [main]
    paths:
      - 'scripts/update-market-news.py'
      - '.github/workflows/update-market-news.yml'
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: market-intelligence-news
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update curated market news
        run: python scripts/update-market-news.py

      - name: Commit when content changes
        run: |
          if git diff --quiet -- data/market-news.json; then
            echo "No market-news changes"
            exit 0
          fi
          git config user.name "dapps-platform-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/market-news.json
          git commit -m "Refresh market intelligence news"
          git push
