name: Fix Mobile Banner Overlay

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mobile-banner-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep dropdown above update banner
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('js/site.js')
          s = p.read_text()
          old = "@media(max-width:780px){.site-header{position:relative!important;inset:auto!important;background:#031431}.hero-content{padding-top:70px!important}.page-hero{padding-top:70px!important}.nav-links{z-index:100}.site-update{position:relative;z-index:1}}"
          new = "@media(max-width:780px){.site-header{position:relative!important;inset:auto!important;background:#031431;overflow:visible!important}.nav{position:relative!important;z-index:1000!important}.menu{position:relative!important;z-index:1002!important}.nav-links{z-index:1001!important}.site-update{position:relative!important;z-index:1!important}.hero-content{padding-top:70px!important}.page-hero{padding-top:70px!important}}"
          if old not in s:
              raise SystemExit('Expected mobile override not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/site.js
          git diff --cached --quiet && exit 0
          git commit -m "Keep mobile dropdown above company update banner"
          git push
